<!DOCTYPE html>
<html>
<head>
  <title>LIFF Firebase Login</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.11/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.11/firebase-auth-compat.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jwt-decode@3/build/jwt-decode.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.11/firebase-firestore-compat.js"></script>


</head>
<body>
<h2>LINEログイン中...</h2>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyAYhXAbSYBGAyd2bs3cDII2Yx7VoCD5Fm0", // ご自身のFirebaseプロジェクトのAPIキーに置き換えてください
    authDomain: "poker-first-5f294.firebaseapp.com",
    projectId: "poker-first-5f294",
  };
  firebase.initializeApp(firebaseConfig);

  // index.html

async function main() {
    // ... (main関数の内容はそのまま) ...
    try {
        console.log("LIFF初期化開始");
        await liff.init({ liffId: "2007691508-Or2XYlPv" }); // ご自身のLIFF IDに置き換えてください
        console.log("LIFF初期化完了");
    } catch (error) {
        console.error("LIFFの初期化に失敗しました:", error);
        alert("LINE連携の準備に失敗しました。ページを再読み込みするか、しばらくしてからお試しください。詳細: " + error.message);
        return;
    }

    if (!liff.isLoggedIn()) {
        console.log("LINE未ログインのためログイン処理開始");
        liff.login();
        return;
    }
    console.log("LINEログイン済み");

    try {
        const idToken = liff.getIDToken();
        if (!idToken) {
            alert("LINE IDトークンの取得に失敗しました。再度お試しください。");
            console.error("liff.getIDToken() returned null or empty when trying to call Cloud Function.");
            return;
        }
        console.log("IDトークン取得 (for Cloud Function):", idToken ? "成功" : "失敗または空");

        try {
            const decodedToken = jwt_decode(idToken);
            console.log("Decoded ID Token:", decodedToken);
            const expirationTime = new Date(decodedToken.exp * 1000);
            const issueTime = new Date(decodedToken.iat * 1000);
            const currentTime = new Date();
            console.log("ID Token Issued At (iat):", issueTime.toISOString(), `(${issueTime})`);
            console.log("ID Token Expires At (exp):", expirationTime.toISOString(), `(${expirationTime})`);
            console.log("Current Time (at token check):", currentTime.toISOString(), `(${currentTime})`);
            if (currentTime.getTime() > expirationTime.getTime()) {
                console.warn("★★★ Warning: ID Token appears to be expired immediately after retrieval! ★★★");
            } else {
                const remainingTimeSeconds = (expirationTime.getTime() - currentTime.getTime()) / 1000;
                const remainingMinutes = Math.floor(remainingTimeSeconds / 60);
                const remainingSecondsPart = Math.floor(remainingTimeSeconds % 60);
                console.log(`ID Token remaining validity: approx. ${remainingMinutes} minutes and ${remainingSecondsPart} seconds`);
            }
        } catch (e) {
            console.error("Error decoding ID token or calculating expiry:", e);
        }

        console.log("Cloud Functions呼び出し開始");
        console.log("Sending idToken to Cloud Function:", idToken);
        console.log("Type of idToken:", typeof idToken);

        const response = await fetch("https://us-central1-poker-first-5f294.cloudfunctions.net/getFirebaseCustomToken", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ idToken: idToken }),
        });
        console.log("Cloud Functions呼び出し完了");

        if (!response.ok) {
            let errorMessage = "カスタムトークンの取得に失敗しました。";
            try {
                const errorData = await response.json();
                if (errorData && errorData.error_description) {
                    errorMessage += `\nサーバーからのメッセージ: ${errorData.error_description}`;
                } else if (errorData && errorData.error) {
                    errorMessage += `\nサーバーからのエラー: ${errorData.error}`;
                } else {
                    errorMessage += `\nステータス: ${response.status}`;
                }
            } catch (e) {
                errorMessage += `\nステータス: ${response.status} (レスポンス解析エラー: ${e.message})`;
            }
            alert(errorMessage);
            console.error(errorMessage);
            return;
        }

        const data = await response.json();
        if (!data || !data.firebaseToken) {
            alert("サーバーから有効なFirebaseトークンが返されませんでした。");
            console.error("サーバーから有効なFirebaseトークンが返されませんでした。", data);
            return;
        }
        console.log("Firebaseカスタムトークン取得成功:", data.firebaseToken);
        await firebase.auth().signInWithCustomToken(data.firebaseToken);
        alert("Firebaseログイン完了！");
        console.log("Firebaseログイン成功！ User:", firebase.auth().currentUser);

// Firestoreにユーザー情報を登録
const user = firebase.auth().currentUser;
if (user) {
  const decoded = liff.getDecodedIDToken();  // LIFFから取得したIDトークンの中身（名前や画像）

  const userDoc = {
    uid: user.uid,
    name: decoded.name || "名前未設定",
    pictureUrl: decoded.picture || "",
    createdAt: firebase.firestore.FieldValue.serverTimestamp(),
  };

  await firebase.firestore().collection("users").doc(user.uid).set(userDoc, { merge: true });
  console.log("Firestoreにユーザー情報を登録:", userDoc);
}


    } catch (error) {
        console.error("Cloud Functions呼び出しまたはFirebaseログインでエラー:", error);
        let detailedErrorMessage = "サーバーとの通信またはログイン処理でエラーが発生しました。時間をおいて再度お試しください。";
        if (error.message) {
            detailedErrorMessage += `\n詳細: ${error.message}`;
        }
        if (error.response && typeof error.response.text === 'function') {
            try {
                const errorText = await error.response.text();
                detailedErrorMessage += `\nサーバーレスポンス: ${errorText}`;
            } catch (e) {
                detailedErrorMessage += "\nサーバーレスポンスの取得に失敗しました。";
            }
        }
        alert(detailedErrorMessage);
        return;
    }
}

// ★★★ DOMContentLoadedを待ってmainを実行 ★★★
document.addEventListener('DOMContentLoaded', main);

</script>
</body>
</html>
